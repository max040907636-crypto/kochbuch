<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App-Icon „Löffelweise“: Emaille-blauer Buchdeckel mit Holzlöffel und rotem Lesebändchen -->
  <defs>
    <linearGradient id="deckel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C4F7A"/>
      <stop offset="1" stop-color="#16304F"/>
    </linearGradient>
    <linearGradient id="holz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C39A"/>
      <stop offset="1" stop-color="#B88F62"/>
    </linearGradient>
    <radialGradient id="glanz" cx=".3" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Hintergrund füllt die ganze Fläche (wichtig für Android-Masken) -->
  <rect width="512" height="512" fill="url(#deckel)"/>
  <rect width="512" height="512" fill="url(#glanz)"/>
  <!-- feiner Rahmen wie auf dem Buchdeckel -->
  <rect x="104" y="104" width="304" height="304" rx="26" fill="none" stroke="#FAFAF6" stroke-opacity=".35" stroke-width="5"/>
  <!-- Lesebändchen oben -->
  <path d="M330 96 h36 v118 l-18 -16 l-18 16 z" fill="#A8323A"/>
  <path d="M330 96 h12 v104 l-12 10 z" fill="#7E1F24"/>
  <!-- Holzlöffel, schräg -->
  <g transform="rotate(-38 256 270)">
    <rect x="243" y="250" width="26" height="150" rx="13" fill="url(#holz)"/>
    <ellipse cx="256" cy="200" rx="54" ry="74" fill="url(#holz)"/>
    <ellipse cx="256" cy="194" rx="38" ry="56" fill="#9C7348" opacity=".45"/>
    <ellipse cx="244" cy="176" rx="12" ry="22" fill="#fff" opacity=".35"/>
  </g>
</svg>
